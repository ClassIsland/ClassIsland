name: Build Windows & macOS Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v2.1.0-bashu'
        type: string
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build_windows:
    name: Build Windows x64 Native Installer & Portable
    runs-on: windows-2022
    env:
      TAG_NAME: ${{ github.event.inputs.release_tag || 'v2.1.0-bashu' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET SDKs (8.0 and 9.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Generate Dummy Secrets File
        shell: pwsh
        run: |
          ./tools/release-gen/generate-secrets.ps1

      - name: Publish ClassIsland.Desktop for Windows x64
        shell: pwsh
        run: |
          dotnet publish ClassIsland.Desktop/ClassIsland.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishBuilding=true -p:PublishPlatform=windows -p:Platforms_Windows=true -p:ClassIsland_PlatformTarget=x64 -p:SelfContained=true -p:ClassIsland_SelfContained=true -p:ApplicationVersion=2.1.0 -p:ApplicationDisplayVersion=2.1.0 -o ${{ github.workspace }}/out_publish

      - name: Verify and Prepare Executables
        shell: pwsh
        run: |
          Get-ChildItem -Path "${{ github.workspace }}/out_publish"
          if (Test-Path "${{ github.workspace }}/out_publish/ClassIsland.Desktop.exe") {
            Copy-Item "${{ github.workspace }}/out_publish/ClassIsland.Desktop.exe" "${{ github.workspace }}/out_publish/ClassIsland.exe" -Force
          }
          if (-not (Test-Path "${{ github.workspace }}/out_publish/ClassIsland.exe")) {
            throw "ClassIsland.exe was not found in out_publish!"
          }

      - name: Prepare Installer Output Directory
        shell: pwsh
        run: |
          Set-Content -Value "installer" -Path "${{ github.workspace }}/out_publish/PackageType" -Force -NoNewline
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/out_installer"

      - name: Build Inno Setup Installer (.exe)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./installer/setup.iss
          options: |
            /DAppVersion=2.1.0
            /FClassIsland-Teaching-Windows-x64-Setup
            /O${{ github.workspace }}\out_installer
            /DSourceDir=${{ github.workspace }}\out_publish
            /DArch=x64

      - name: Prepare Portable Zip
        shell: pwsh
        run: |
          Set-Content -Value "folder" -Path "${{ github.workspace }}/out_publish/PackageType" -Force -NoNewline
          Compress-Archive -Path "${{ github.workspace }}/out_publish/*" -DestinationPath "${{ github.workspace }}/out_installer/ClassIsland-Teaching-Windows-x64-Portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland-Windows-x64-Binaries
          path: |
            ${{ github.workspace }}/out_installer/*.exe
            ${{ github.workspace }}/out_installer/*.zip

      - name: Release Windows Binaries to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "ClassIsland 智慧教研版 ${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          body: |
            ## ClassIsland 智慧教研版（Windows & macOS 双平台发布）

            本版本基于 ClassIsland 官方 Avalonia 原生客户端深度定制，专为两江巴蜀智慧校园环境打造。

            ### 核心更新与修复
            - **课表日期与实时更新彻底修复：** 解决今日课表被误判为“明天”的问题，接入 UI 实时刷新机制，排课变更 5 秒内自动呈现在大屏。
            - **广播通知与语音播报：** 默认启用通知朗读与 1.wav 提示音，确保通知正文全员清晰听清。
            - **实时对讲语音接入：** 完整支持两江巴蜀平台网页端“按住说话”实时对讲，大屏端低延迟拉取播放并弹出对讲卡片。
            - **极简配对体验：** 主岛与托盘菜单新增“绑定班级大屏”一键直达，预填平台地址，仅需输入 6 位配对码即可 1 步完成绑定。
            - **双平台支持：** 提供 Windows 64位安装包/便携版与 macOS（Apple Silicon 与 Intel）原生版本。

            ### 下载文件说明
            - **Windows 一键安装版：** `ClassIsland-Teaching-Windows-x64-Setup.exe`
            - **Windows 绿色便携版：** `ClassIsland-Teaching-Windows-x64-Portable.zip`
            - **macOS (Apple Silicon M1/M2/M3/M4)：** `ClassIsland-Teaching-macOS-arm64.zip`
            - **macOS (Intel)：** `ClassIsland-Teaching-macOS-x64.zip`
          files: |
            ${{ github.workspace }}/out_installer/*.exe
            ${{ github.workspace }}/out_installer/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

  build_macos:
    name: Build macOS (Apple Silicon & Intel) Release
    runs-on: macos-15
    env:
      TAG_NAME: ${{ github.event.inputs.release_tag || 'v2.1.0-bashu' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET SDKs (8.0 and 9.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install macOS Workload
        run: |
          dotnet workload install macos --version 9.0.300

      - name: Generate Dummy Secrets File
        run: |
          pwsh ./tools/release-gen/generate-secrets.ps1

      - name: Publish ClassIsland for macOS Apple Silicon (arm64)
        run: |
          dotnet publish ClassIsland.Desktop/ClassIsland.Desktop.csproj -c Release -r osx-arm64 --self-contained true -p:PublishBuilding=true -p:PublishPlatform=macos -p:Platforms_MacOs=true -p:ClassIsland_PlatformTarget=arm64 -p:SelfContained=true -p:ClassIsland_SelfContained=true -p:ApplicationVersion=2.1.0 -p:ApplicationDisplayVersion=2.1.0 -o ${{ github.workspace }}/out_mac_arm64

      - name: Publish ClassIsland for macOS Intel (x64)
        run: |
          dotnet publish ClassIsland.Desktop/ClassIsland.Desktop.csproj -c Release -r osx-x64 --self-contained true -p:PublishBuilding=true -p:PublishPlatform=macos -p:Platforms_MacOs=true -p:ClassIsland_PlatformTarget=x64 -p:SelfContained=true -p:ClassIsland_SelfContained=true -p:ApplicationVersion=2.1.0 -p:ApplicationDisplayVersion=2.1.0 -o ${{ github.workspace }}/out_mac_x64

      - name: Package macOS Bundles
        run: |
          mkdir -p ${{ github.workspace }}/out_mac_packages
          cd ${{ github.workspace }}/out_mac_arm64
          zip -r -y ${{ github.workspace }}/out_mac_packages/ClassIsland-Teaching-macOS-arm64.zip .
          cd ${{ github.workspace }}/out_mac_x64
          zip -r -y ${{ github.workspace }}/out_mac_packages/ClassIsland-Teaching-macOS-x64.zip .

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland-macOS-Binaries
          path: |
            ${{ github.workspace }}/out_mac_packages/*.zip

      - name: Release macOS Binaries to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            ${{ github.workspace }}/out_mac_packages/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
