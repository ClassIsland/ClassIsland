name: Build iOS

on:
  pull_request:
    paths:
      - '.github/workflows/build_ios.yml'
      - '.github/workflows/_build_ios_reusable.yml'
      - '.nuke/build.schema.json'
      - 'global.json'
      - '*.props'
      - 'build/**'
      - 'build.sh'
      - 'ClassIsland.iOS/**'
      - 'ClassIsland.iOS.Native/**'
      - 'ClassIsland/**'
      - 'ClassIsland.Core/**'
      - 'ClassIsland.Shared/**'
      - 'ClassIsland.Shared.IPC/**'
      - 'ClassIsland.Platforms.Abstractions/**'
      - 'ClassIsland.Platforms.Abstractions.Tests/**'
      - 'ClassIsland.Filter.iOS.slnf'
      - 'ClassIsland.sln'
      - 'tools/ci/verify-ios-build-config.ps1'
      - 'tools/ci/verify-ios-ipa.sh'
      - 'tools/ci/verify-cobertura-coverage.ps1'
      - 'vendors/EdgeTtsSharp/**'
  push:
    branches:
      - master
      - develop/v2/ios
    tags:
      - 'ios-v*'
    paths:
      - '.github/workflows/build_ios.yml'
      - '.github/workflows/_build_ios_reusable.yml'
      - '.nuke/build.schema.json'
      - 'global.json'
      - '*.props'
      - 'build/**'
      - 'build.sh'
      - 'ClassIsland.iOS/**'
      - 'ClassIsland.iOS.Native/**'
      - 'ClassIsland/**'
      - 'ClassIsland.Core/**'
      - 'ClassIsland.Shared/**'
      - 'ClassIsland.Shared.IPC/**'
      - 'ClassIsland.Platforms.Abstractions/**'
      - 'ClassIsland.Platforms.Abstractions.Tests/**'
      - 'ClassIsland.Filter.iOS.slnf'
      - 'ClassIsland.sln'
      - 'tools/ci/verify-ios-build-config.ps1'
      - 'tools/ci/verify-ios-ipa.sh'
      - 'tools/ci/verify-cobertura-coverage.ps1'
      - 'vendors/EdgeTtsSharp/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build unsigned iOS IPA
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/_build_ios_reusable.yml
    with:
      checkout_ref: ${{ github.sha }}
      app_version: '1.0.0'
      build_number: ${{ format('{0}', github.run_number) }}
      brand_type: Production
      developer_preview: true
      retention_days: 14
