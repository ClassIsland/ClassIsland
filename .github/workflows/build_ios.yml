name: Build iOS

on:
  pull_request:
    paths:
      - '.github/workflows/build_ios.yml'
      - 'global.json'
      - '*.props'
      - 'ClassIsland.iOS/**'
      - 'ClassIsland.iOS.Native/**'
      - 'ClassIsland/**'
      - 'ClassIsland.Core/**'
      - 'ClassIsland.Shared/**'
      - 'ClassIsland.Shared.IPC/**'
      - 'ClassIsland.Platforms.Abstractions/**'
      - 'ClassIsland.Platforms.Abstractions.Tests/**'
      - 'ClassIsland.Filter.iOS.slnf'
      - 'ClassIsland.sln'
      - 'vendors/EdgeTtsSharp/**'
  push:
    branches:
      - master
      - develop/v2/ios
    tags:
      - 'ios-v*'
    paths:
      - '.github/workflows/build_ios.yml'
      - 'global.json'
      - '*.props'
      - 'ClassIsland.iOS/**'
      - 'ClassIsland.iOS.Native/**'
      - 'ClassIsland/**'
      - 'ClassIsland.Core/**'
      - 'ClassIsland.Shared/**'
      - 'ClassIsland.Shared.IPC/**'
      - 'ClassIsland.Platforms.Abstractions/**'
      - 'ClassIsland.Platforms.Abstractions.Tests/**'
      - 'ClassIsland.Filter.iOS.slnf'
      - 'ClassIsland.sln'
      - 'vendors/EdgeTtsSharp/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  IOS_PROJECT: ClassIsland.iOS/ClassIsland.iOS.csproj
  IOS_SOLUTION_FILTER: ClassIsland.Filter.iOS.slnf
  IOS_CONFIGURATION: Debug
  IOS_RUNTIME_IDENTIFIER: ios-arm64
  APPLICATION_ID: cn.classisland.ios
  XCODE_PATH: /Applications/Xcode_26.5.app
  APP_BUNDLE_PATH: ${{ github.workspace }}/ClassIsland.iOS/bin/Debug/net10.0-ios/ios-arm64/ClassIsland.iOS.app
  IPA_PATH: ${{ github.workspace }}/out/ClassIsland-iOS-unsigned.ipa

jobs:
  build-unsigned-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -project ClassIsland.iOS.Native/ClassIsland.iOS.Native.xcodeproj -list

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add GitHub Packages source
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget add source
          --username github-actions
          --password "$NUGET_AUTH_TOKEN"
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/ClassIsland/index.json"

      - name: Restore iOS workload and packages
        run: |
          dotnet workload restore "$IOS_PROJECT"
          dotnet restore "$IOS_SOLUTION_FILTER"
          dotnet restore "$IOS_PROJECT" -r "$IOS_RUNTIME_IDENTIFIER"

      - name: Run platform abstraction tests
        run: dotnet test ClassIsland.Platforms.Abstractions.Tests/ClassIsland.Platforms.Abstractions.Tests.csproj -c Release

      - name: Build unsigned iOS device app
        run: >-
          dotnet build "$IOS_PROJECT"
          -f net10.0-ios
          -c "$IOS_CONFIGURATION"
          -r "$IOS_RUNTIME_IDENTIFIER"
          --no-restore
          -m:1
          -p:BrandType=Production
          -p:EnableCodeSigning=false

      - name: Package unsigned IPA
        run: |
          if [[ ! -d "$APP_BUNDLE_PATH" ]]; then
            echo "::error::Unsigned app bundle not found at $APP_BUNDLE_PATH"
            exit 1
          fi

          staging_directory="$(mktemp -d "$RUNNER_TEMP/classisland-unsigned-ipa.XXXXXX")"
          mkdir -p "$staging_directory/Payload" "$(dirname "$IPA_PATH")"
          /usr/bin/ditto "$APP_BUNDLE_PATH" "$staging_directory/Payload/ClassIsland.iOS.app"
          (
            cd "$staging_directory"
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_PATH"
          )

      - name: Verify unsigned IPA
        run: |
          if [[ ! -f "$IPA_PATH" ]]; then
            echo "::error::Unsigned IPA was not produced at $IPA_PATH"
            exit 1
          fi

          verify_directory="$(mktemp -d "$RUNNER_TEMP/classisland-verify-ipa.XXXXXX")"
          /usr/bin/ditto -x -k "$IPA_PATH" "$verify_directory"
          shopt -s nullglob
          app_bundles=("$verify_directory"/Payload/*.app)
          if [[ "${#app_bundles[@]}" -ne 1 ]]; then
            echo "::error::The IPA must contain exactly one app bundle"
            exit 1
          fi

          app_bundle="${app_bundles[0]}"
          extension_bundle="$app_bundle/PlugIns/ClassIslandLiveActivityExtension.appex"
          bridge_bundle="$app_bundle/Frameworks/ClassIslandLiveActivityBridge.framework"
          bridge_binary="$bridge_bundle/ClassIslandLiveActivityBridge"
          if [[ ! -d "$extension_bundle" ]]; then
            echo "::error::The Live Activity extension is missing from the IPA"
            exit 1
          fi
          if [[ ! -f "$bridge_binary" ]]; then
            echo "::error::The Live Activity bridge framework is missing from the IPA"
            exit 1
          fi

          app_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_bundle/Info.plist")"
          extension_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension_bundle/Info.plist")"
          if [[ "$app_bundle_id" != "$APPLICATION_ID" ]]; then
            echo "::error::The app bundle ID is $app_bundle_id, expected $APPLICATION_ID"
            exit 1
          fi
          if [[ "$extension_bundle_id" != "$APPLICATION_ID.LiveActivityExtension" ]]; then
            echo "::error::The extension bundle ID is $extension_bundle_id, expected $APPLICATION_ID.LiveActivityExtension"
            exit 1
          fi

          assert_unsigned_bundle() {
            local bundle_path="$1"
            local bundle_name="$2"
            if [[ -e "$bundle_path/embedded.mobileprovision" || -d "$bundle_path/_CodeSignature" ]]; then
              echo "::error::$bundle_name unexpectedly contains signing data"
              exit 1
            fi
          }

          assert_unsigned_bundle "$app_bundle" "The main app"
          assert_unsigned_bundle "$extension_bundle" "The Live Activity extension"
          assert_unsigned_bundle "$bridge_bundle" "The Live Activity bridge"

          app_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Info.plist")"
          extension_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$extension_bundle/Info.plist")"
          app_binary="$app_bundle/$app_executable"
          extension_binary="$extension_bundle/$extension_executable"

          assert_arm64() {
            local binary_path="$1"
            local binary_name="$2"
            if ! /usr/bin/lipo -archs "$binary_path" | tr ' ' '\n' | grep -qx arm64; then
              echo "::error::$binary_name does not contain the arm64 architecture"
              exit 1
            fi
          }

          assert_arm64 "$app_binary" "The main app"
          assert_arm64 "$extension_binary" "The Live Activity extension"
          assert_arm64 "$bridge_binary" "The Live Activity bridge"

          assert_minimum_ios() {
            local binary_path="$1"
            local binary_name="$2"
            local expected_version="$3"
            local minimum_version
            minimum_version="$(/usr/bin/xcrun vtool -show-build "$binary_path" | awk '$1 == "minos" { print $2; exit }')"
            if [[ "$minimum_version" != "$expected_version" && "$minimum_version" != "$expected_version.0" ]]; then
              echo "::error::$binary_name has minimum iOS $minimum_version, expected iOS $expected_version"
              exit 1
            fi
          }

          assert_minimum_ios "$app_binary" "The main app" "13.0"
          assert_minimum_ios "$bridge_binary" "The Live Activity bridge" "13.0"
          assert_minimum_ios "$extension_binary" "The Live Activity extension" "16.1"

          while IFS= read -r dependency; do
            case "$dependency" in
              @rpath/*)
                relative_dependency="${dependency#@rpath/}"
                if [[ ! -e "$app_bundle/Frameworks/$relative_dependency" ]]; then
                  echo "::error::The bridge dependency $dependency is not bundled"
                  exit 1
                fi
                ;;
            esac
          done < <(/usr/bin/otool -L "$bridge_binary" | awk 'NR > 1 { print $1 }')

          if /usr/bin/otool -l "$app_binary" | awk '
            $1 == "cmd" { load_command = $2 }
            $1 == "name" && $2 ~ /ActivityKit\.framework\/ActivityKit/ && load_command != "LC_LOAD_WEAK_DYLIB" { found = 1 }
            END { exit found ? 0 : 1 }
          '; then
            echo "::error::The main app strongly links ActivityKit"
            exit 1
          fi

          if ! /usr/bin/otool -l "$bridge_binary" | awk '
            $1 == "cmd" { load_command = $2 }
            $1 == "name" && $2 ~ /ActivityKit\.framework\/ActivityKit/ && load_command == "LC_LOAD_WEAK_DYLIB" { found = 1 }
            END { exit found ? 0 : 1 }
          '; then
            echo "::error::The Live Activity bridge does not weak-link ActivityKit"
            exit 1
          fi

          shasum -a 256 "$IPA_PATH" > "$IPA_PATH.sha256"

      - name: Write build summary
        run: |
          {
            echo "### ClassIsland unsigned iOS IPA"
            echo "- Bundle ID: \`$APPLICATION_ID\`"
            echo "- Runtime: \`$IOS_RUNTIME_IDENTIFIER\`"
            echo "- SHA-256: \`$(cut -d ' ' -f 1 "$IPA_PATH.sha256")\`"
            echo "- The IPA must be signed externally before installation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassIsland-iOS-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.IPA_PATH }}.sha256
          if-no-files-found: error
          retention-days: 14
